name: ai_clients_dart_workspace
description: A collection of Dart client libraries for popular AI APIs. Provides type-safe, well-documented, and idiomatic interfaces to OpenAI, Anthropic, Google AI (Gemini), Mistral, Ollama, and other providers. Ready for Dart and Flutter.
publish_to: none

environment:
  sdk: ^3.12.0

dev_dependencies:
  melos: ^8.7.0

workspace:
  - packages/anthropic_sdk_dart
  - packages/chromadb
  - packages/googleai_dart
  - packages/mistralai_dart
  - packages/ollama_dart
  - packages/openai_dart
  - packages/openai_realtime_dart
  - packages/open_responses
  - packages/tavily_dart
  - packages/vertex_ai

melos:
  repository: https://github.com/davidmigloz/ai_clients_dart

  command:
    version:
      linkToCommits: true
      includeCommitId: true
      workspaceChangelog: true
      releaseUrl: true
      branch: main
      changelogs:
        - path: CHANGELOG.md
          packageFilters:
            no-private: true
    bootstrap:
      environment:
        sdk: ">=3.12.0 <4.0.0"
      dependencies:
        googleapis: ^17.0.0
        http: ^1.6.0
        http_parser: ^4.1.2
        logging: ^1.3.0
        meta: ^1.16.0
        web_socket: ^1.0.1
      dev_dependencies:
        # Keep a Dart 3.12-compatible lower bound while allowing current tooling.
        build_runner: ^2.15.1
        freezed: '>=3.2.5 <5.0.0'
        test: ^1.31.1
        mocktail: ^1.0.4
        coverage: ^1.15.0

  scripts:
    test:
      description: Run all Dart tests
      exec:
        command: dart test
        concurrency: 1
        failFast: true
      packageFilters:
        dirExists: test

    test:diff:
      description: Run tests for changed packages
      exec:
        command: dart test
        concurrency: 1
        failFast: true
      packageFilters:
        diff: origin/main
        dirExists: test
